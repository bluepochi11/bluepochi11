<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="poch1 — Cybersecurity Researcher and Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1018"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1C2330" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="899" height="259" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .dotPulse { animation: pulse 2.4s ease-in-out infinite; }
      .orbit1 { transform-origin: 750px 142px; animation: spinSlow 36s linear infinite; }
      .orbit2 { transform-origin: 750px 142px; animation: spinRev 24s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <rect width="900" height="260" fill="url(#glow)"/>

    <!-- Top Chrome Bar -->
    <rect x="0" y="0" width="900" height="38" fill="#0B0E14" fill-opacity="0.92"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#1E2532" stroke-width="1"/>
    <line x1="0" y1="39" x2="540" y2="39" stroke="url(#accentLine)" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="24" cy="19" r="4" fill="#2A3241"/>
    <circle cx="38" cy="19" r="4" fill="#2A3241"/>
    <circle cx="52" cy="19" r="4" fill="#2A3241"/>
    <line x1="72" y1="11" x2="72" y2="27" stroke="#1E2532" stroke-width="1"/>
    <text x="86" y="23" class="mono" font-size="10.5" fill="#7D8590" letter-spacing="1.6">OPERATOR // POCH1</text>

    <!-- Live Status Indicator -->
    <circle cx="702" cy="19" r="3.5" fill="#10B981" class="dotPulse"/>
    <text x="876" y="23" text-anchor="end" class="mono" font-size="10.5" fill="#8B949E" letter-spacing="1.1">ACTIVE · SEC-NODE ID</text>

    <!-- Left Content Block -->
    <text x="42" y="80" class="mono" font-size="11" fill="#38BDF8" letter-spacing="2.4">0x50 0x4F 0x43 0x48 0x31</text>

    <!-- Display Name with Inline Blinking Cursor (Zero Drift Across All OS Fonts) -->
    <text x="40" y="138" class="sans" font-size="54" font-weight="700" fill="#F0F6FC" letter-spacing="-1.4">poch1<tspan class="mono cursor" fill="#38BDF8" font-weight="400" dx="4">_</tspan></text>

    <!-- Subtitle -->
    <text x="42" y="170" class="sans" font-size="15.5" font-weight="500" fill="#9CA3AF" letter-spacing="0.2">Cybersecurity Researcher  ·  Software Engineer</text>

    <!-- Terminal Command Strip -->
    <rect x="42" y="194" width="560" height="36" rx="7" fill="#0F141D" stroke="#1F2735" stroke-width="1"/>
    <text x="58" y="216" class="mono" font-size="11.2"><tspan fill="#38BDF8">$</tspan><tspan fill="#E6EDF3"> whoami --domains  </tspan><tspan fill="#8B949E">appsec · reverse-eng · android-sec · fullstack</tspan></text>

    <!-- Right Security Reticle / Precision Shield Motif -->
    <g>
      <!-- Outer Reticle Rings -->
      <circle cx="750" cy="142" r="76" fill="none" stroke="#1E2634" stroke-width="1"/>
      <circle cx="750" cy="142" r="64" fill="none" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="6 8" class="orbit1"/>
      <circle cx="750" cy="142" r="48" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 6" class="orbit2"/>

      <!-- Crosshair Ticks -->
      <line x1="750" y1="54" x2="750" y2="70" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>
      <line x1="750" y1="214" x2="750" y2="230" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>
      <line x1="662" y1="142" x2="678" y2="142" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>
      <line x1="822" y1="142" x2="838" y2="142" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>

      <!-- Precision Hex Shield -->
      <polygon points="750,104 782,118 782,150 750,178 718,150 718,118" fill="#0F1520" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.85"/>
      <polygon points="750,113 773,123 773,147 750,168 727,147 727,123" fill="none" stroke="#1E293B" stroke-width="1"/>

      <!-- Minimalist Terminal Prompt Glyph Inside Shield (>_) -->
      <polyline points="738,133 747,141 738,149" fill="none" stroke="#F0F6FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="752" y1="149" x2="763" y2="149" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Corner Micro Telemetry -->
      <text x="646" y="72" class="mono" font-size="9" fill="#4B5563">SEC.01</text>
      <text x="816" y="72" class="mono" font-size="9" fill="#4B5563">R8/DEX</text>
      <text x="644" y="226" class="mono" font-size="9" fill="#4B5563">ED25519</text>
      <text x="814" y="226" class="mono" font-size="9" fill="#4B5563">0x01FF</text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#222936" stroke-width="1"/>
</svg>
